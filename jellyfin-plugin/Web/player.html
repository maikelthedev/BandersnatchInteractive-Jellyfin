<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Black Mirror: Bandersnatch — Interactive</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
  html, body { margin: 0; padding: 0; height: 100%; background: #000; overflow: hidden;
               font-family: "Helvetica Neue", Arial, sans-serif; color: #fff; }
  #stage { position: fixed; inset: 0; background: #000; }
  video { position: absolute; inset: 0; width: 100%; height: 100%; background: #000;
          object-fit: contain; outline: none; }

  /* ---------- choice overlay ---------- */
  #overlay { position: absolute; inset: 0; pointer-events: none; z-index: 10; }
  #choices { position: absolute; left: 0; right: 0; bottom: 9vh; display: none;
             justify-content: center; align-items: stretch; gap: 1.2rem; padding: 0 4vw;
             pointer-events: auto; flex-wrap: wrap; }
  #choices.on { display: flex; }
  .choice { background: rgba(12, 12, 12, .82); border: 2px solid rgba(255,255,255,.55); color: #fff;
            font-size: 1.15rem; font-weight: 600; padding: 1rem 1.6rem; border-radius: 3px;
            cursor: pointer; min-width: 9rem; text-align: center; letter-spacing: .01em;
            transition: background .12s, border-color .12s, transform .12s; backdrop-filter: blur(3px); }
  .choice:hover { border-color: #fff; }
  .choice.sel { background: #fff; color: #000; border-color: #fff; transform: scale(1.04); }

  #caption { position: absolute; left: 0; right: 0; bottom: 4.5vh; text-align: center;
             font-size: .95rem; letter-spacing: .18em; text-transform: uppercase;
             color: rgba(255,255,255,.75); display: none; }
  #caption.on { display: block; }

  #bar { position: absolute; left: 0; bottom: 0; height: 3px; background: #e50914; width: 0;
         transition: width .15s linear; }

  /* ---------- phone code (take the phone number) ---------- */
  #keypad { position: absolute; left: 50%; bottom: 8vh; transform: translateX(-50%); display: none;
            background: rgba(0,0,0,.85); border: 1px solid rgba(255,255,255,.35); padding: 1rem 1.2rem;
            border-radius: 6px; pointer-events: auto; text-align: center; }
  #keypad.on { display: block; }
  #slots { font-size: 2rem; letter-spacing: .5rem; margin-bottom: .7rem; font-family: monospace; }
  .keys { display: grid; grid-template-columns: repeat(5, 3rem); gap: .4rem; }
  .keys button { background: #222; color: #fff; border: 1px solid #555; padding: .6rem 0;
                 font-size: 1.1rem; cursor: pointer; border-radius: 3px; }
  .keys button:hover { background: #444; }

  /* ---------- chrome ---------- */
  #hud { position: absolute; top: 0; right: 0; padding: .8rem 1rem; font-size: .8rem; z-index: 11;
         color: rgba(255,255,255,.55); text-align: right; line-height: 1.5; opacity: 0;
         transition: opacity .3s; pointer-events: none; }
  #hud.on { opacity: 1; }
  .seg { font-family: monospace; font-size: .95rem; color: #fff; }

  #start { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center;
           justify-content: center; background: rgba(0,0,0,.88); z-index: 30; cursor: pointer;
           text-align: center; padding: 2rem; }
  #start.hide { display: none; }
  #start h1 { font-size: 1.7rem; font-weight: 300; margin: 0 0 .4rem; letter-spacing: .04em; }
  #start .sub { color: rgba(255,255,255,.6); font-size: .9rem; margin-bottom: 2rem; }
  #start .go { background: #e50914; border-radius: 4px; padding: .9rem 2.2rem; font-size: 1.1rem;
               font-weight: 600; }
  #start .keys-help { margin-top: 2.2rem; color: rgba(255,255,255,.45); font-size: .78rem; line-height: 1.9; }
  kbd { background: rgba(255,255,255,.14); border-radius: 3px; padding: .1rem .4rem; font-family: monospace; }

  #msg { position: absolute; left: 50%; top: 50%; transform: translate(-50%,-50%); z-index: 40;
         max-width: 80vw; text-align: center; background: rgba(0,0,0,.9); border: 1px solid #e50914;
         padding: 1.2rem 1.6rem; border-radius: 4px; display: none; }
  #msg.on { display: block; }

  #toast { position: absolute; left: 50%; top: 8vh; transform: translateX(-50%); z-index: 20;
           background: rgba(0,0,0,.75); padding: .5rem 1rem; border-radius: 3px; font-family: monospace;
           font-size: 1rem; opacity: 0; transition: opacity .2s; }
  #toast.on { opacity: 1; }
</style>
</head>
<body>
<div id="stage">
  <video id="video" preload="metadata" playsinline></video>

  <div id="overlay">
    <div id="caption"></div>
    <div id="choices"></div>
    <div id="keypad">
      <div id="slots">- - - - -</div>
      <div class="keys">
        <button data-d="1">1</button><button data-d="2">2</button><button data-d="3">3</button>
        <button data-d="4">4</button><button data-d="5">5</button>
        <button data-d="6">6</button><button data-d="7">7</button><button data-d="8">8</button>
        <button data-d="9">9</button><button data-d="0">0</button>
      </div>
    </div>
    <div id="bar"></div>
  </div>

  <div id="hud">
    <div class="seg" id="hud-seg"></div>
    <div id="hud-speed"></div>
  </div>

  <div id="toast"></div>
  <div id="msg"></div>

  <div id="start">
    <h1>Black Mirror: Bandersnatch</h1>
    <div class="sub">Choose-your-own-adventure — the story branches on your choices.</div>
    <div class="go">▶ &nbsp;Play</div>
    <div class="keys-help">
      <kbd>←</kbd> <kbd>→</kbd> choices / jump &nbsp;·&nbsp; <kbd>Enter</kbd> select &nbsp;·&nbsp;
      <kbd>Space</kbd> pause &nbsp;·&nbsp; <kbd>↑</kbd> <kbd>↓</kbd> speed &nbsp;·&nbsp;
      <kbd>0</kbd> reset speed &nbsp;·&nbsp; <kbd>S</kbd> subtitles &nbsp;·&nbsp;
      <kbd>F</kbd> fullscreen &nbsp;·&nbsp; <kbd>R</kbd> restart
    </div>
  </div>
</div>

<script src="/InteractiveVideo/Assets/bandersnatch.js"></script>
<script src="/InteractiveVideo/Assets/SegmentMap.js"></script>
<script src="/InteractiveVideo/Assets/choices-en.js"></script>
<script src="/InteractiveVideo/Assets/interactive-player.js"></script>
<script>
  (function () {
    var itemId = '{{ITEM_ID}}';
    if (!itemId || itemId.indexOf('{{') === 0) {
      document.getElementById('msg').className = 'on';
      document.getElementById('msg').textContent = 'No item id supplied.';
      document.getElementById('start').className = 'hide';
      return;
    }
    window.player = new BandersnatchPlayer(itemId);
  })();
</script>
</body>
</html>
