name: Secret Scan

# Runs on every push and pull request, so a credential is caught by the
# repository's own CI as soon as it lands - not only when a release is
# published.  This workflow only reads the checkout and needs no secrets.

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  trufflehog:
    name: Scan history for secrets
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0          # every commit, not just the pushed tip

      - name: Install trufflehog
        run: |
          curl -sSfL https://raw.githubusercontent.com/trufflesecurity/trufflehog/main/scripts/install.sh \
            | sh -s -- -b "$RUNNER_TEMP/bin" v3.95.3
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"

      - name: Scan the history for secrets
        run: trufflehog git "file://$GITHUB_WORKSPACE" --no-update --fail --github-actions
